name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy-production.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/geekyard-backend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ── Docker Build & Push ──
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to EC2 ──
      - name: Transfer infra files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "infra/deploy.sh,infra/docker-compose.production.yml,infra/nginx/nginx.prod.conf"
          target: /opt/geekyard/
          strip_components: 1

      - name: Deploy backend to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/geekyard
            chmod +x deploy.sh
            export DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}

            docker pull $DOCKER_IMAGE

            bash deploy.sh production $DOCKER_IMAGE || {
              echo "=== geekyard-production container logs ==="
              docker logs geekyard-production --tail 100 2>&1 || true
              exit 1
            }

  build-frontend:
    needs: [build-backend]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.${{ secrets.PRODUCTION_DOMAIN }}
        run: npm run build

      - name: Transfer dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: frontend/dist/
          target: /opt/geekyard/frontend/
          strip_components: 1

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            docker exec geekyard-nginx-production nginx -s reload 2>/dev/null || \
            (cd /opt/geekyard && docker compose -f docker-compose.production.yml restart nginx)

  health-check:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -sf https://api.${{ secrets.PRODUCTION_DOMAIN }}/actuator/health | jq -r '.status' 2>/dev/null || echo "DOWN")
            if [ "$STATUS" = "UP" ]; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Waiting for health check... ($i/30)"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
