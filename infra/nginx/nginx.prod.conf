upstream backend {
    server app:8080;
}

server {
    listen 80;
    server_name geekyard.soaengry.com api.geekyard.soaengry.com;
    return 301 https://$host$request_uri;
}

# 프론트엔드
server {
    listen 443 ssl;
    server_name geekyard.soaengry.com;

    ssl_certificate /etc/letsencrypt/live/geekyard.soaengry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geekyard.soaengry.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|webp|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# 백엔드 API
server {
    listen 443 ssl;
    server_name api.geekyard.soaengry.com;

    ssl_certificate /etc/letsencrypt/live/geekyard.soaengry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geekyard.soaengry.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /actuator/health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator {
        deny all;
        return 403;
    }

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
